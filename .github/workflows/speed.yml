name: speed

# Did this commit get more expensive than the committed baseline says?
#
# WHAT IS JUDGED. Not elapsed time. `scripts/ci/counter.py` measures a
# load-invariant COUNTER for the unit suite and for each renderer workload,
# and this job compares them against speed-baseline.json.
#
# ONE INSTRUMENT FOR BOTH POPULATIONS: CPU SECONDS, from
# `resource.getrusage(RUSAGE_CHILDREN)` around each measured child. On-CPU
# time, so steal time — the thing that makes a duration on a shared runner
# meaningless — is excluded, which is what makes it valid under the ruling
# behind issue #81.
#
# READ THIS BEFORE THE NUMBERS BELOW, BECAUSE IT CHANGES WHAT THEY ARE WORTH:
# THIS GATE RUNS ON CPU SECONDS, NOT ON A DETERMINISTIC COUNTER. Instruction
# counts and syscall counts are both deterministic and both would have been
# strictly better instruments; neither survived measurement on the cell that
# will read this baseline. What ships is a GROSS-REGRESSION NET, not a
# sensitive gate, and the budgets below are sized to stay quiet on a noisy
# cell rather than to catch a 10% regression. That is a real cost of the
# minutes budget, and it is named as one here, in counter.py's docstring, in
# the comparator's METRIC_NOTES, and in every report this job writes.
#
# THE TWO BETTER INSTRUMENTS, AND WHY NEITHER IS HERE. Both were measured on
# this cell — ubuntu24 image 20260927.320.1, kernel 6.17.0-1022-azure — not
# assumed, so the next reader can re-run them rather than take this file's
# word for it:
#
#   36811152307  Instruction counts: perf_event_paranoid is 4, `perf` IS
#                installed, and `perf stat -e instructions` still exits 255
#                with "Access to performance monitoring and observability
#                operations is limited." Unavailable.
#   36812466498  Syscall counts: `strace -f -c` works here (ptrace_scope is 1,
#                which restricts tracing to your own descendants — and
#                strace IS the parent of what it traces, so it is inside the
#                restriction). It is exactly deterministic: three runs of one
#                workload gave the same total every time (870 calls, 89
#                errors) while that report's own `% time` column swung
#                between 17.34% and 48.84%. DETERMINISTIC, AND NOT
#                AFFORDABLE: 0.24-0.25s against 0.19s untraced on that small
#                workload, and over the real renderer workloads 64830 /
#                68057 / 75870 ms per bench round against 5053 / 5684 /
#                6215 ms untraced — 12.8x, landing almost entirely on
#                render-impact.py, which shells out to git (237727-238180
#                syscalls at 63.7-74.6 wall seconds traced, while render.py at
#                2007 syscalls and render-responsiveness.py at 1927 are
#                seconds each). On a cell whose suite round is ~20s, 12.8x on
#                two bench rounds costs minutes to save tens of seconds.
#
# The standing rule that leaves: an instrument the cell cannot use does not
# belong in the gate, and neither does one that costs more than the thing it
# measures. Both were tried. Both lost on numbers.
#
# WHY WALL TIME IS NOT A MAGNITUDE. A GitHub-hosted runner is a multi-tenant
# VM. Steal time, a neighbouring container, a different core and a different
# CPU model all move an elapsed duration, and none of that is the code being
# measured. The maintainer ruling behind issue #81 is stronger than that:
# paired wall-clock A/B is not a valid magnitude ANYWHERE — not on a shared
# box, and not in one job on a CI runner — so this job no longer checks out
# the last release to get "the same runner", because the same runner was
# never the thing that made the number mean anything.
#
# The probe step below still runs, and still prints the two kernel settings
# that decide whether a deterministic counter is possible at all —
# perf_event_paranoid and yama ptrace_scope. A reader who sees CPU seconds in
# use can then see that the alternatives were measured and unavailable or too
# expensive, rather than assuming nobody thought of them.
#
# ONE BUDGET PER POPULATION, BECAUSE THEIR SPREADS DIFFER BY AN ORDER OF
# MAGNITUDE. Measured here: the unit suite spread 22.2% min-to-max over six
# runs (27.434 / 27.988 / 28.920 / 30.210 / 32.044 / 33.521), while over
# eight runs each the renderer workloads spread 19.5% (bench.render-impact,
# 3.4578-4.1315), 54.1% (bench.render, 0.1179-0.1817) and 72.9%
# (bench.render-responsiveness, 0.1103-0.1907). The short workloads are the
# WORST, not the best, which is the opposite of what was expected when this
# budget was chosen: fixed overhead and a co-tenant's load dominate a
# measurement this brief. So the renderer half does not get a tight budget
# for free — it needs a loose one for a different reason than the suite needs
# a loose one, and one global `tolerance` could not have expressed that. Each
# population therefore carries its own `metric` and `tolerance` in
# speed-baseline.json, and each comparison names the population it judges.
#
# DERIVING THOSE BUDGETS: AT LEAST TWICE THE SPREAD MEASURED ON THE CELL THAT
# WILL READ THE BASELINE, and re-derived there — never carried from here. This
# box is shared, so its numbers are an upper bound: a budget sized from 22.2%
# would be 0.45, and from 72.9% above 1.4, which is not a gate at all. On a
# quiet dedicated cell the same kind of workload spread 7.6% min-to-max (run
# 36812285024), and 0.25 — roughly three times that — would be honest there.
# Whoever derives the baseline on the runner measures both populations again
# first; if the runner's spreads come anywhere near this box's, the honest
# conclusion is that CPU seconds cannot gate per entry on that cell, and the
# baseline's `basis` must say so rather than record a number that looks like
# a gate.
#
# ROUNDS stays 2, for two reasons that are not the same reason. --selfcheck
# compares SVG bytes across head rounds and needs at least two, and that
# control is byte-identity, not timing, so nothing about the instrument could
# have weakened it. Separately, with a counter this noisy the minimum across
# repeated rounds is the least-noisy observation of the same work.
#
# WHY A COMMITTED BASELINE. It removes the pairing entirely and makes the
# comparison point reviewable. The previous shape ran the last release and
# this commit side by side in one job; the ruling above says that bought
# nothing, so the release lookup and the second checkout are gone.
#
# WHY THE BASELINE ONLY RATCHETS DOWN. The comparator refuses a head counter
# above baseline x (1 + tolerance) per entry. Separately, the last step
# diffs the committed baseline against the MERGE BASE's copy and fails if any
# entry went up — otherwise a commit could raise the ceiling it is measured
# against in the same push, and the gate would be switched off from inside.
#
# UNTIL A BASELINE EXISTS. There is no speed-baseline.json committed yet,
# because a baseline has to be measured ON THIS CELL and inventing one from
# another machine would be exactly the error this whole change exists to stop
# committing. Until it exists the comparator prints what it measured, writes
# it to the step summary in a form that can be pasted straight in, and exits
# 0 — the same shape as the "no release exists yet" path this file has always
# had. A green gate with an EMPTY summary is the thing this repository keeps
# failing reviews over, so that path is not silent.
#
# WHY THE BASELINE ONLY RATCHETS DOWN. The comparator refuses a head counter
# above baseline x (1 + tolerance) per entry. Separately, the last step
# diffs the committed baseline against the MERGE BASE's copy and fails if any
# entry went up — otherwise a commit could raise the ceiling it is measured
# against in the same push, and the gate would be switched off from inside.
#
# WHICH CONTROLS SURVIVED, AND WHY.
#   * The offline fixtures and pinned inputs are untouched: a measurement of
#     a live API is not reproducible, so the same fixtures still build the
#     same work every round.
#   * The closed-set check (--require-test / --allow-removal) stays, and
#     still has to. A gate that measures fewer renderers than it advertises
#     is decorative, whatever quantity it is comparing.
#   * --selfcheck still runs on the last head round, and still compares SVG
#     BYTES across head rounds. That control is byte-identity, not timing, so
#     the counter change cannot have weakened it.
#   * A failing suite run is NOT a speed verdict — tests.yml owns that. But a
#     counter measured over a suite that failed is not comparable either, so
#     the run's exit code is deliberately ignored here and the comparator's
#     refusal (exit 2, which the step turns into a red exactly as the old
#     contract did) is what reports it. The step summary says why nothing
#     was compared, because a red box with an empty summary is a red nobody
#     can act on.
#
# PYTEST IS STILL INSTALLED, AND IT IS NOT A TIMING HARNESS ANY MORE.
# `unittest discover` imports every test_*.py module it collects, and
# test_compare_durations.py imports pytest at module level; without pytest the
# discovery pass — and therefore this measurement — cannot run at all. The
# install below is for that import and nothing else. No test in this
# repository is written against pytest.

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'PRESENTATION.txt'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'

  # Read-only measurement on a contributor head, forks included
  # (issue #8): the same counter-vs-baseline comparison, before merge.
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'PRESENTATION.txt'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: speed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  speed:
    runs-on: ubuntu-latest

    env:
      # Fractional increase in the shared total that fails the job. The
      # per-entry down-only tolerance comes from the baseline's own
      # `tolerance`, which is where a number that must be re-derived belongs.
      MAX_REGRESSION: "0.30"
      ROUNDS: "2"
      BASELINE: speed-baseline.json

    steps:
      - name: Check out this commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install the test toolchain
        # NOT a timing harness. `unittest discover` imports every test
        # module it collects, and test_compare_durations.py imports pytest
        # at module level; without it the collection pass this job depends
        # on cannot run. pytest emits no report here — the counter writes
        # the JUnit itself.
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r head/requirements-test.txt

      - name: Probe the counter instrument
        id: probe
        # Once per job. There is one instrument, so nothing is being chosen
        # here — what this step exists for is the RECORD of why. It prints
        # perf_event_paranoid and yama ptrace_scope, the two kernel settings
        # that decide whether a deterministic counter is possible at all, so
        # a reader who sees CPU seconds in use can see the alternatives were
        # measured rather than assumed away.
        run: |
          python3 head/scripts/ci/counter.py --probe > probe.env
          cat probe.env
          grep -E '^(metric|metric_reason|perf_event_paranoid|ptrace_scope)=' \
            probe.env >> "$GITHUB_OUTPUT"

      - name: Build renderer fixtures
        env:
          GH_BENCH_FIXTURE_ROOT: ${{ runner.temp }}/gh7-fixture
        run: |
          python3 head/scripts/bench/fixture_setup.py \
            --root "$GH_BENCH_FIXTURE_ROOT"

      - name: Measure the unit suite
        # One CPU-second measurement of the whole suite per round, emitted as
        # one JUnit suite each.
        #
        # The suite's exit code is deliberately NOT this job's verdict:
        # tests.yml owns pass/fail. What this step must guarantee is that a
        # report exists for every round, so it checks for them explicitly
        # rather than trusting a code it ignores.
        env:
          GH_COUNTER_METRIC: cpu_time
        run: |
          mkdir -p reports
          for round in $(seq 1 "$ROUNDS"); do
            echo "::group::unit suite round $round"
            status=0
            python3 head/scripts/ci/counter.py \
              --junit-file "reports/unit-$round.xml" \
              --name 'counter::unit-suite' \
              --timeout 3600 \
              -- python3 -m unittest discover || status=$?
            echo "unit suite round $round exited $status" \
                 "(tests.yml owns that verdict)"
            echo "::endgroup::"
          done

          missing=0
          for round in $(seq 1 "$ROUNDS"); do
            f="reports/unit-$round.xml"
            if [ ! -s "$f" ]; then
              echo "MISSING or empty: $f" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "A suite produced no JUnit report — it did not run at all," >&2
            echo "which is a setup failure, not a counter result." >&2
            exit 1
          fi
          ls -la reports/

      - name: Collect the unit-test population
        # A collection pass, not a test run: discovery imports the test
        # modules and builds the suite without executing it. The comparator
        # digests these node ids and refuses if the population is not the
        # one the baseline was measured over — a counter total over a
        # different set of tests is not a regression, and it is not a pass
        # either.
        run: |
          python3 head/scripts/ci/compare_durations.py \
            --print-population head > reports/unit-population.txt
          wc -l reports/unit-population.txt

      - name: Run renderer workloads
        env:
          GH_BENCH_FIXTURE_ROOT: ${{ runner.temp }}/gh7-fixture
          # Explicit, rather than relying on the default, so the instrument
          # this population is judged by is visible in the workflow rather
          # than buried in counter.py's fallback chain.
          GH_COUNTER_METRIC: cpu_time
        run: |
          for round in $(seq 1 "$ROUNDS"); do
            echo "::group::renderer round $round"
            selfcheck=()
            if [ "$round" -eq "$ROUNDS" ]; then
              selfcheck=(--selfcheck)
            fi
            python3 head/scripts/bench/e2e_bench.py \
              --side head \
              --repo-root head \
              --round "$round" \
              --junit-file "reports/bench-head-$round.xml" \
              --work-root "$RUNNER_TEMP/gh7-bench/head" \
              "${selfcheck[@]}"
            echo "::endgroup::"
          done
          ls -la reports/

      - name: Compare
        env:
          # The exemption list for a workload the harness STILL lists but
          # which must not be compared: a comma-separated set of workload
          # node ids. Naming one drops it from the required list, so the
          # closed-set check will not demand it.
          #
          # LEAVING THIS EMPTY IS THE CORRECT DEFAULT, and the ordinary way
          # to retire a renderer workload is NOT to use this variable: drop
          # the workload from WORKLOADS instead. Then the harness measures
          # neither side, the closed-set check has nothing unexplained to
          # complain about, and no exemption is needed at all.
          #
          # IT IS NOT A WAY TO PAPER OVER A DELETED RENDERER. Keeping the
          # workload in WORKLOADS while deleting its renderer script reds at
          # the "Run renderer workloads" step instead, because the harness
          # now fails a missing renderer on the head side — long before this
          # comparison runs. So a name here only has an effect on a workload
          # the harness still lists but which is no longer present in the
          # head reports; anything weaker than that has already failed at the
          # bench step.
          #
          # Every name added weakens the gate for every later commit, so it
          # belongs in the same commit as the change that motivates it.
          ALLOWED_WORKLOAD_REMOVALS: ""
        # The comparator comes from the HEAD checkout, so an improvement to
        # the comparison itself takes effect on the commit that makes it
        # rather than one baseline re-derivation later.
        run: |
          # The unit suite first. Its membership changes by design, so the
          # comparison stays permissive — but the population digest above
          # still has to match, or the two sides were not asked the same
          # question.
          if python3 head/scripts/ci/compare_durations.py \
            --baseline "$BASELINE" \
            --population unit-suite \
            --head reports/unit-1.xml reports/unit-2.xml \
            --population-file reports/unit-population.txt \
            --max-regression "$MAX_REGRESSION" \
            --base-label 'the committed baseline (unit suite)' \
            --summary-file "$GITHUB_STEP_SUMMARY"; then
            unit_status=0
          else
            unit_status=$?
          fi

          # Renderer workloads keep their own closed-set gate.
          #
          # Unlike the unit suite, this population is CLOSED. Unit tests come
          # and go by design, so an added or removed test must not turn the
          # gate red; but the renderer workload set IS what this half of the
          # gate exists to measure, and a shipped renderer that vanished from
          # the head reports would otherwise leave it comparing one fewer
          # program and still reporting a pass.
          #
          # The allowed removals are parsed FIRST, because the harness
          # still lists a retired workload and a name that is both required
          # and allowed to disappear is a contradiction the comparator
          # rejects. So a declared removal also drops out of the required
          # list — which is what "deliberately no longer measured" means.
          removals=()
          allowed=()
          if [ -n "${ALLOWED_WORKLOAD_REMOVALS:-}" ]; then
            IFS=',' read -ra allowed <<< "$ALLOWED_WORKLOAD_REMOVALS"
            for name in "${allowed[@]}"; do
              # `if`, not `[ -n ... ] && append`: under bash -e a false test
              # as the last command in the loop body becomes the loop's own
              # status, so a trailing empty element would abort the step on
              # an otherwise successful parse of the list.
              if [ -n "$name" ]; then
                removals+=(--allow-removal "$name")
              fi
            done
          fi

          workloads=()
          # The required list is read from the harness rather than written
          # out here, so adding a workload to WORKLOADS cannot drift out of
          # the gate.
          #
          # It is read into a VARIABLE, not straight out of a process
          # substitution, because bash -e cannot see a process substitution's
          # exit status. An empty listing there leaves no --require-test at
          # all, which is precisely issue 36's false green: the gate compares
          # the survivors and reports a pass. So the status is checked, and
          # then the emptiness is checked — a producer that dies and a
          # producer that legitimately prints nothing look identical from
          # stdout alone, and both must refuse rather than degrade.
          if ! listing=$(python3 head/scripts/bench/e2e_bench.py --list-workloads); then
            echo "::error::the workload listing failed; the renderer gate would measure an undeclared population" >&2
            exit 1
          fi
          if [ -z "$listing" ]; then
            echo "::error::the workload listing is empty; the renderer gate would measure an undeclared population" >&2
            exit 1
          fi
          while IFS= read -r name; do
            required=1
            for skip in "${allowed[@]}"; do
              if [ "$name" = "$skip" ]; then
                required=0
                break
              fi
            done
            if [ "$required" -ne 0 ]; then
              workloads+=(--require-test "$name")
            fi
          done <<< "$listing"

          # The second way to switch this gate off is to exempt everything
          # from it. Naming all three workloads as allowed removals would
          # leave an empty required list and no diagnostic, which is the same
          # false green by another route, so it is refused here rather than
          # left to be discovered as a green job summary.
          if [ "${#workloads[@]}" -eq 0 ]; then
            echo "::error::every workload is an allowed removal, so the renderer gate compares nothing; if that is intended, retire the workloads from WORKLOADS instead" >&2
            exit 1
          fi

          # shellcheck disable=SC2046
          if python3 head/scripts/ci/compare_durations.py \
            --baseline "$BASELINE" \
            --population renderer-workloads \
            --head $(ls reports/bench-head-*.xml) \
            --max-regression "$MAX_REGRESSION" \
            --base-label 'the committed baseline (renderer workloads)' \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            "${workloads[@]}" "${removals[@]}"; then
            renderer_status=0
          else
            renderer_status=$?
          fi

          if [ "$unit_status" -ne 0 ] || [ "$renderer_status" -ne 0 ]; then
            exit 1
          fi

      - name: The committed baseline only ratchets down
        # The comparator refuses a head counter above its baseline, but
        # nothing there stops a commit from EDITING the baseline upwards in
        # the same push. This step judges the baseline against the MERGE
        # BASE's copy of it, so raising the ceiling you are measured against
        # is itself a red.
        #
        # Skipped on a push to main: there is no base commit for that event,
        # and a ratchet step that silently judged the wrong base would be
        # worse than one that does not run.
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if ! git cat-file -e "$BASE_SHA:$BASELINE" 2>/dev/null; then
            echo "No $BASELINE at the merge base, so there is nothing to" \
                 "ratchet against."
            exit 0
          fi
          git show "$BASE_SHA:$BASELINE" > "$RUNNER_TEMP/base-baseline.json"
          python3 head/scripts/ci/compare_durations.py \
            --ratchet-baselines "$RUNNER_TEMP/base-baseline.json" "$BASELINE"

      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: speed-junit-reports
          path: |
            reports/
            ${{ runner.temp }}/gh7-bench/**/outputs/**
          if-no-files-found: warn