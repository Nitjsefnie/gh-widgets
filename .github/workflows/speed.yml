name: speed

# Did the test suite get slower since the last release?
#
# THE MEASUREMENT ONLY MEANS ANYTHING BECAUSE BOTH BUILDS RUN HERE. A
# GitHub runner's speed varies by roughly a factor of two between jobs, so
# a duration recorded in one job compared against a duration recorded in
# another measures the runners, not the code. This job checks out the last
# release AND this commit, runs both on the same machine, and reports the
# ratio. That is what makes a 30% budget a real threshold rather than a
# coin flip.
#
# Rounds are INTERLEAVED — base, head, base, head — and each test's
# duration is the minimum across its rounds. Interleaving keeps a warming
# page cache or a noisy neighbour from landing entirely on one side; the
# minimum estimates the floor, which is the quantity that actually changes
# when code gets slower.
#
# WHY PYTEST APPEARS HERE AND NOWHERE ELSE. This repo's suite is stdlib
# unittest, and it stays that way — `python3 -m unittest discover` is how
# these tests are run, in tests.yml and locally. pytest is used here purely
# as a TIMING HARNESS: it collects the existing unittest TestCases
# unchanged and can emit `--junitxml`, which stdlib unittest cannot, and
# the comparator needs an exact per-test duration. Nothing in the suite is
# written against pytest and nothing should be.
#
# The runtime is pure stdlib, so neither side installs anything but the
# timing harness — which means, unusually, that both sides run under the
# SAME pytest. That is correct here: with no runtime dependencies there is
# no dependency bump for this gate to attribute a slowdown to.
#
# CALIBRATION, so the 30% budget is not a guess. Two runs of IDENTICAL
# code, back to back on one machine, moved the shared-test total by 1.7%
# while individual tests moved by up to 370%. That is the whole argument
# for this shape: gate on the total (noise ~2%, budget 30%, comfortable
# margin) and treat any single test's number as unreliable.
#
# Until the first release exists there is nothing to compare against, and
# this job says so and exits green rather than failing.

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'PRESENTATION.txt'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'

  # Read-only measurement on a contributor head, forks included
  # (issue #8): the same base-release-vs-head comparison, before merge.
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'PRESENTATION.txt'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: speed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  speed:
    runs-on: ubuntu-latest

    env:
      # Fractional slowdown that fails the job.
      MAX_REGRESSION: "0.30"
      ROUNDS: "2"

    steps:
      - name: Find the baseline release
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # `gh api` on a 404 prints its JSON error body to STDOUT and exits
        # nonzero, so a `|| true` here would assign that blob to $tag, the
        # "no release yet" guard would see a non-empty string, and
        # actions/checkout would be handed a refspec made of JSON. Hence
        # both belts: branch on the EXIT CODE, then validate the SHAPE.
        run: |
          tag=""
          if out="$(gh api -H "Cache-Control: no-cache" \
                    "repos/$REPO/releases/latest" --jq '.tag_name' 2>/dev/null)"; then
            tag="$out"
          fi
          case "$tag" in
            null) tag="" ;;
            *[!A-Za-z0-9._-]*)
              echo "Unexpected payload where a tag was expected; treating" >&2
              echo "as 'no baseline' rather than passing it to git." >&2
              tag=""
              ;;
          esac
          if [ -z "$tag" ]; then
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No release exists yet, so there is no baseline to compare"
            echo "against. This becomes a real gate once release.yml cuts one."
            {
              echo "### Test speed"
              echo
              echo "Skipped: no release exists yet to use as a baseline."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "Baseline: $tag"
          fi

      - name: Check out this commit
        if: steps.baseline.outputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false

      - name: Check out the baseline release
        if: steps.baseline.outputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.baseline.outputs.tag }}
          path: base
          persist-credentials: false

      - name: Check out HEAD for renderer validation
        if: steps.baseline.outputs.tag == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: head
          persist-credentials: false

      - name: Set up Python for renderer validation
        if: steps.baseline.outputs.tag == ''
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.baseline.outputs.tag != ''
        with:
          python-version: "3.13"

      - name: Install the timing harness
        if: steps.baseline.outputs.tag != ''
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r head/requirements-test.txt

      - name: Build renderer fixtures
        env:
          GH_BENCH_FIXTURE_ROOT: ${{ runner.temp }}/gh7-fixture
        run: |
          python3 head/scripts/bench/fixture_setup.py \
            --root "$GH_BENCH_FIXTURE_ROOT"

      - name: Run both suites, interleaved
        if: steps.baseline.outputs.tag != ''
        # A failing test does NOT fail this job: tests.yml owns that
        # verdict, and here a non-passing testcase is simply excluded from
        # the comparison. What this step must guarantee is that four
        # usable reports exist, so it checks for them explicitly rather
        # than trusting an exit code it deliberately ignores.
        run: |
          mkdir -p reports
          for round in $(seq 1 "$ROUNDS"); do
            for side in base head; do
              echo "::group::$side round $round"
              ( cd "$side" && python3 -m pytest -q -p no:cacheprovider --tb=no \
                  --junitxml="$GITHUB_WORKSPACE/reports/$side-$round.xml" ) \
                && echo "$side round $round: all passed" \
                || echo "$side round $round: some tests did not pass (excluded)"
              echo "::endgroup::"
            done
          done

          missing=0
          for round in $(seq 1 "$ROUNDS"); do
            for side in base head; do
              f="reports/$side-$round.xml"
              if [ ! -s "$f" ]; then
                echo "MISSING or empty: $f" >&2
                missing=1
              fi
            done
          done
          if [ "$missing" -ne 0 ]; then
            echo "A suite produced no JUnit report — it did not run at all," >&2
            echo "which is a setup failure, not a speed result." >&2
            exit 1
          fi
          ls -la reports/

      - name: Run renderer workloads, interleaved
        if: steps.baseline.outputs.tag != ''
        env:
          GH_BENCH_FIXTURE_ROOT: ${{ runner.temp }}/gh7-fixture
        run: |
          for round in $(seq 1 "$ROUNDS"); do
            for side in base head; do
              echo "::group::$side renderer round $round"
              selfcheck=()
              if [ "$side" = "head" ] && [ "$round" -eq "$ROUNDS" ]; then
                selfcheck=(--selfcheck)
              fi
              python3 head/scripts/bench/e2e_bench.py \
                --side "$side" \
                --repo-root "$side" \
                --round "$round" \
                --junit-file "reports/bench-$side-$round.xml" \
                --work-root "$RUNNER_TEMP/gh7-bench/$side" \
                "${selfcheck[@]}"
              echo "::endgroup::"
            done
          done
          ls -la reports/

      - name: Validate renderer workloads without a baseline
        if: steps.baseline.outputs.tag == ''
        env:
          GH_BENCH_FIXTURE_ROOT: ${{ runner.temp }}/gh7-fixture
        run: |
          mkdir -p reports
          work_root="$RUNNER_TEMP/gh7-bench/head-only"
          for round in $(seq 1 "$ROUNDS"); do
            selfcheck=()
            if [ "$round" -eq "$ROUNDS" ]; then
              selfcheck=(--selfcheck)
            fi
            python3 head/scripts/bench/e2e_bench.py \
              --side head \
              --repo-root head \
              --round "$round" \
              --junit-file "reports/bench-head-$round.xml" \
              --work-root "$work_root" \
              "${selfcheck[@]}"
          done
          ls -la reports/

      - name: Compare
        if: steps.baseline.outputs.tag != ''
        env:
          BASE_TAG: ${{ steps.baseline.outputs.tag }}
          # The exemption list for a workload the harness STILL lists but
          # which must not be compared: a comma-separated set of workload
          # node ids. Naming one drops it from the required list, so the
          # closed-set check will not demand it.
          #
          # LEAVING THIS EMPTY IS THE CORRECT DEFAULT, and the ordinary way
          # to retire a renderer workload is NOT to use this variable: drop
          # the workload from WORKLOADS instead. Then the harness measures
          # neither side, the closed-set check has nothing unexplained to
          # complain about, and no exemption is needed at all.
          #
          # IT IS NOT A WAY TO PAPER OVER A DELETED RENDERER. Keeping the
          # workload in WORKLOADS while deleting its renderer script reds at
          # the "Run renderer workloads" step instead, because the harness
          # now fails a missing renderer on the head side — long before this
          # comparison runs. So a name here only exempts a workload that is
          # still listed and still running; anything weaker than that has
          # already failed elsewhere.
          #
          # Every name added weakens the gate for every later commit, so it
          # belongs in the same commit as the change that motivates it.
          ALLOWED_WORKLOAD_REMOVALS: ""
        # The comparator comes from the HEAD checkout, so an improvement to
        # the comparison itself takes effect on the commit that makes it
        # rather than one release later.
        run: |
          # shellcheck disable=SC2046
          if python3 head/scripts/ci/compare_durations.py \
            --base $(ls reports/base-*.xml) \
            --head $(ls reports/head-*.xml) \
            --max-regression "$MAX_REGRESSION" \
            --base-label "$BASE_TAG" \
            --summary-file "$GITHUB_STEP_SUMMARY"; then
            unit_status=0
          else
            unit_status=$?
          fi

          # Keep renderer workloads in their own testcase intersection and gate.
          #
          # Unlike the unit suite, this population is CLOSED. Unit tests come
          # and go by design, so an added or removed test must not turn the
          # gate red; but the renderer workload set IS what this half of the
          # gate exists to measure, and a shipped renderer that vanished from
          # the head reports would otherwise leave it comparing one fewer
          # program and still reporting a pass.
          #
          # The allowed removals are parsed FIRST, because the harness
          # still lists a retired workload and a name that is both required
          # and allowed to disappear is a contradiction the comparator
          # rejects. So a declared removal also drops out of the required
          # list — which is what "deliberately no longer measured" means.
          removals=()
          allowed=()
          if [ -n "${ALLOWED_WORKLOAD_REMOVALS:-}" ]; then
            IFS=',' read -ra allowed <<< "$ALLOWED_WORKLOAD_REMOVALS"
            for name in "${allowed[@]}"; do
              # `if`, not `[ -n ... ] && append`: under bash -e a false test
              # as the last command in the loop body becomes the loop's own
              # status, so a trailing empty element would abort the step on
              # an otherwise successful parse of the list.
              if [ -n "$name" ]; then
                removals+=(--allow-removal "$name")
              fi
            done
          fi

          workloads=()
          # The required list is read from the harness rather than written
          # out here, so adding a workload to WORKLOADS cannot drift out of
          # the gate.
          #
          # It is read into a VARIABLE, not straight out of a process
          # substitution, because bash -e cannot see a process substitution's
          # exit status. An empty listing there leaves no --require-test at
          # all, which is precisely issue 36's false green: the gate compares
          # the survivors and reports a pass. So the status is checked, and
          # then the emptiness is checked — a producer that dies and a
          # producer that legitimately prints nothing look identical from
          # stdout alone, and both must refuse rather than degrade.
          if ! listing=$(python3 head/scripts/bench/e2e_bench.py --list-workloads); then
            echo "::error::the workload listing failed; the renderer gate would measure an undeclared population" >&2
            exit 1
          fi
          if [ -z "$listing" ]; then
            echo "::error::the workload listing is empty; the renderer gate would measure an undeclared population" >&2
            exit 1
          fi
          while IFS= read -r name; do
            required=1
            for skip in "${allowed[@]}"; do
              if [ "$name" = "$skip" ]; then
                required=0
                break
              fi
            done
            if [ "$required" -ne 0 ]; then
              workloads+=(--require-test "$name")
            fi
          done <<< "$listing"

          # The second way to switch this gate off is to exempt everything
          # from it. Naming all three workloads as allowed removals would
          # leave an empty required list and no diagnostic, which is the same
          # false green by another route, so it is refused here rather than
          # left to be discovered as a green job summary.
          if [ "${#workloads[@]}" -eq 0 ]; then
            echo "::error::every workload is an allowed removal, so the renderer gate compares nothing; if that is intended, retire the workloads from WORKLOADS instead" >&2
            exit 1
          fi

          # shellcheck disable=SC2046
          if python3 head/scripts/ci/compare_durations.py \
            --base $(ls reports/bench-base-*.xml) \
            --head $(ls reports/bench-head-*.xml) \
            --max-regression "$MAX_REGRESSION" \
            --base-label "$BASE_TAG renderer workloads" \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            "${workloads[@]}" "${removals[@]}"; then
            renderer_status=0
          else
            renderer_status=$?
          fi

          if [ "$unit_status" -ne 0 ] || [ "$renderer_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload JUnit reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: speed-junit-reports
          path: |
            reports/
            ${{ runner.temp }}/gh7-bench/**/outputs/**
          if-no-files-found: warn
