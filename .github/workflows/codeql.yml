name: codeql

# Static security analysis (advanced setup, not the repo-settings "default
# setup" — the config lives here so it is reviewable in a diff like every
# other gate). Free on this public repository; findings land in the
# Security tab rather than turning the build red, so a new query shipping
# upstream cannot block an unrelated push.
#
# TRIGGERS. The consolidated tests workflow scans changed code and reports
# pull-request results against the contributor head. This schedule re-applies
# new query packs to code that has not changed since it shipped, updating the
# Security tab with findings from the default branch.
#
# The weekly cron is not redundant with changed-code scans: CodeQL's query packs are
# updated continuously, and a new query only ever runs against code that
# has changed since it shipped. Without the cron, a rule published today
# would never be applied to a file last touched last year.

on:
  schedule:
    # Wednesday 03:47 UTC. Off the hour and off Monday deliberately: the
    # top of the hour is when every cron on GitHub fires at once and jobs
    # queue for a long time.
    - cron: '47 3 * * 3'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      # Writing the analysis results is the whole point; everything else
      # stays read-only. The scope holds on pull_request runs too, where
      # the upload is what files the PR's checks and annotations. GitHub
      # downgrades it to read for FORK PRs — the untrusted case — so a
      # fork head cannot write anything with it; a same-repository PR
      # runs with the trust of its author, who already has write. The PR
      # gate is therefore not literally read-only; what is guaranteed is
      # that an untrusted head gets no write.
      security-events: write
      actions: read
      contents: read

    strategy:
      # Only one language here — this repo has no JS at all. The matrix
      # stays a matrix so adding one later is a one-line change rather
      # than a restructure.
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No `ref:` here, unlike the other workflows: CodeQL must analyse
          # exactly the commit it will file alerts against, which is the
          # event's own SHA.
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # `security-extended` over the default `security` pack: these scripts
          # hold a GitHub token, shell out to git, parse untrusted API
          # responses and write files under a cache root — which is what
          # the extra precision-medium queries are good at.
          queries: security-extended
          config: |
            paths-ignore:
              - docs

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
