name: gitfame-resync-memory

# Measures the PEAK MEMORY of a full `render-impact.py --resync` under two
# git-fame builds, to size one specific behavioural difference between them.
#
# Why this exists. Upstream git-fame 4.0.0 runs the per-file `git blame` calls
# through `tqdm.contrib.concurrent.thread_map`, which is `list(ex.map(...))`:
# every file is submitted to the pool up front and every file's blame output is
# retained until the whole repo is done. The Nitjsefnie-OSC fork used a bounded
# window (`imap_bounded`, at most min(2*jobs, jobs+4) outstanding) and consumed
# results as a generator. Both run the same number of blames concurrently, so
# this is a memory question, not a throughput one.
#
# Why --resync is the workload rather than a synthetic git-fame benchmark: it is
# the real consumer path AND the maximum-blame case (it ignores the cache and
# re-blames every repo), so it is exactly the condition under which a dropped
# work window would show.
#
# One full resync both ways ran 30-40 minutes (an indicative wall), past a
# 20-minute measure job, so each matrix job is ONE run: one arm, one repeat,
# one of six shards of the pinned repos, on its own runner and cgroup. The
# report proves every shard ran once and states a repeat's full-resync peak as
# the max over its shards: the largest single repo sets it, and one shard
# blames that repo whole. Limits, not measured: memory.peak counts page cache,
# which a shard's cgroup no longer shares with other shards' repos; and the
# clone lookahead (default 3) overlaps that repo's blame with its neighbours
# in the shard, not the ones a full run clones beside it.
#
# This workflow is measurement-only. It never writes to the repo, never
# publishes an SVG anywhere, and reads only public GitHub data.

on:
  # Dispatch only. This used to carry the weekly targeted-vs-git-fame drift
  # audit as well, which had nothing to do with measuring memory and was
  # undiscoverable under this name; it now lives in targeted-blame-audit.yml
  # and runs on that schedule. What remains here is a measurement you ask for
  # when you want it.
  #
  # The `inputs.x || <default>` spellings below are kept: they cost nothing and
  # they are what let a non-dispatch trigger work at all, should one return.
  workflow_dispatch:
    inputs:
      repeats:
        description: "Repeats per build (>=2 so an outlier is visible)"
        required: false
        default: "2"
      user:
        description: "GitHub login whose impact card is rendered"
        required: false
        default: "Nitjsefnie"
      builds:
        description: >-
          Space-separated arms to run: fork (the pinned baseline), up (PyPI
          4.0.0), new (whatever `new_ref` names). One arm and repeats=1 is an
          attribution run rather than a comparison.
        required: false
        default: "fork up"
      new_ref:
        description: "Fork ref installed as the `new` arm"
        required: false
        default: "perf-blame"
      blame_method:
        description: >-
          targeted (default in the renderer), fame (the git-fame reference),
          or both (run both; ANY disagreement fails the run).
        required: false
        default: "both"
      extra_emails:
        description: >-
          GH_WIDGETS_GH_EXTRA_EMAILS, mirroring units/gh-widgets.service.
          Without it the
          audit certifies a DIFFERENT email set than the one that renders the
          real card, and line ownership is an exact match against that set.
        required: false
        default: "zmatek.peter@gmail.com"
      clone_lookahead:
        description: >-
          How many repos render-impact.py clones ahead of the blame consuming
          them. 1 reproduces the original one-deep prefetch.
        required: false
        default: "3"

permissions:
  contents: read

concurrency:
  # These dispatch-only measurements run on separate hosted VMs. This group
  # protects measurement retention, not machine contention.
  # cancel-in-progress: false preserves in-flight measurements; queue: max
  # prevents a dispatch from being silently dropped (the default replaces
  # older pending runs).
  group: gitfame-resync-memory-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      builds: ${{ steps.axes.outputs.builds }}
      repeats: ${{ steps.axes.outputs.repeats }}
      shards: ${{ steps.axes.outputs.shards }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency
          # pulls in — reuse it.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Preflight — can this token read the public identity?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_WIDGETS_LOGIN: ${{ inputs.user || 'Nitjsefnie' }}
        run: |
          set -euo pipefail
          # Every query in ghwidgets_common.py is `user(login: $login)` over
          # PUBLIC fields, so the default runner token should suffice. Fail
          # here in seconds rather than 20 minutes into a measurement.
          resp=$(curl -sS -H "Authorization: bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"query(\$l:String!){user(login:\$l){login databaseId organizations(first:5){nodes{login}}}}\",\"variables\":{\"l\":\"$GH_WIDGETS_LOGIN\"}}" \
            https://api.github.com/graphql)
          echo "$resp"
          python3 - "$resp" <<'PYEOF'
          import json, sys
          d = json.loads(sys.argv[1])
          if d.get("errors"):
              sys.exit(f"PREFLIGHT FAILED: GraphQL errors: {d['errors']}")
          u = (d.get("data") or {}).get("user")
          if not u or not u.get("databaseId"):
              sys.exit(f"PREFLIGHT FAILED: no usable user node: {d}")
          print(f"preflight ok: login={u['login']} databaseId={u['databaseId']} "
                f"orgs={[o['login'] for o in u['organizations']['nodes']]}")
          PYEOF

      - name: Resolve one commit per repo, split the repos into shards, emit the matrix
        id: axes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_WIDGETS_GH_USER: ${{ inputs.user || 'Nitjsefnie' }}
          GH_WIDGETS_BUILDS: ${{ inputs.builds || 'new' }}
          GH_WIDGETS_REPEATS: ${{ inputs.repeats || '1' }}
        run: |
          set -euo pipefail
          # Every run blames the same trees, or a repo that moves between
          # clones reads as the memory difference this workflow measures.
          # The shards are the targeted-blame-audit's own.
          python3 scripts/resolve-repo-pins.py --shards 6 --out /tmp/pins.json
          python3 scripts/resync-memory.py axes --pins /tmp/pins.json \
            --builds "$GH_WIDGETS_BUILDS" --repeats "$GH_WIDGETS_REPEATS" >> "$GITHUB_OUTPUT"

      - name: Upload the manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitfame-resync-memory-pins
          path: /tmp/pins.json
          if-no-files-found: error

  measure:
    needs: pins
    runs-on: ubuntu-latest
    # The targeted-blame-audit's bound for one shard both ways, plus a venv.
    timeout-minutes: 40
    strategy:
      # Each run's numbers stand alone; a red one must not cancel the rest.
      fail-fast: false
      matrix:
        build: ${{ fromJSON(needs.pins.outputs.builds) }}
        repeat: ${{ fromJSON(needs.pins.outputs.repeats) }}
        shard: ${{ fromJSON(needs.pins.outputs.shards) }}

    env:
      GH_WIDGETS_BUILD: ${{ matrix.build }}
      GH_WIDGETS_IMPACT_SHARD: ${{ matrix.shard }}
      GH_WIDGETS_RUN_LABEL: ${{ matrix.build }}-r${{ matrix.repeat }}-s${{ matrix.shard }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Environment facts
        run: |
          set -euo pipefail
          echo "nproc=$(nproc)"
          echo "kernel=$(uname -r)"
          echo "cgroup version: $(stat -fc %T /sys/fs/cgroup)"
          free -m
          df -h / | tail -1
          git --version

      - name: Build this arm's virtualenv
        env:
          GH_WIDGETS_NEW_REF: ${{ inputs.new_ref || 'perf-blame' }}
        run: |
          set -euo pipefail
          FORK_PIN="git+https://github.com/Nitjsefnie-OSC/git-fame@66f2f9b4c737961c14bae69a31aac148797b8c29"
          case "$GH_WIDGETS_BUILD" in
            fork) spec="git-fame @ $FORK_PIN" ;;
            up)   spec="git-fame==4.0.0" ;;
            new)  spec="git-fame @ git+https://github.com/Nitjsefnie-OSC/git-fame@$GH_WIDGETS_NEW_REF" ;;
            *)    echo "FATAL: unknown build arm '$GH_WIDGETS_BUILD'"; exit 1 ;;
          esac
          python3 -m venv "/tmp/venv-$GH_WIDGETS_BUILD"
          "/tmp/venv-$GH_WIDGETS_BUILD/bin/pip" install -q --upgrade pip
          "/tmp/venv-$GH_WIDGETS_BUILD/bin/pip" install -q "$spec"
          "/tmp/venv-$GH_WIDGETS_BUILD/bin/git-fame" --version
          # Every arm must genuinely have --jobs, or the comparison is
          # meaningless: a serial-blame build would be a different workload.
          "/tmp/venv-$GH_WIDGETS_BUILD/bin/git-fame" --help | grep -q -- '--jobs'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gitfame-resync-memory-pins
          path: /tmp

      - name: Prepare the cgroup
        run: |
          set -euo pipefail
          if [ ! -f /sys/fs/cgroup/cgroup.controllers ]; then
            echo "FATAL: not cgroup v2"; exit 1
          fi
          echo "root controllers: $(cat /sys/fs/cgroup/cgroup.controllers)"
          echo "root subtree_control before: $(cat /sys/fs/cgroup/cgroup.subtree_control)"
          if ! grep -qw memory /sys/fs/cgroup/cgroup.subtree_control; then
            echo '+memory' | sudo tee /sys/fs/cgroup/cgroup.subtree_control || \
              echo "WARN: could not enable memory controller at root"
          fi
          echo "root subtree_control after: $(cat /sys/fs/cgroup/cgroup.subtree_control)"
          sudo mkdir -p /sys/fs/cgroup/gfbench
          # Tested directly rather than `ls | grep`: the grep matched two
          # exact filenames, so a test for those files says the same thing
          # without the pipeline (shellcheck SC2010) — and this version
          # actually prints what IS there when the check fails, which the
          # original discarded.
          if [ ! -e /sys/fs/cgroup/gfbench/memory.peak ] && \
             [ ! -e /sys/fs/cgroup/gfbench/memory.current ]; then
            echo "FATAL: memory controller not delegated to the test cgroup" >&2
            echo "the cgroup exposes:" >&2
            ls -1 /sys/fs/cgroup/gfbench/ >&2
            exit 1
          fi

      - name: Measure one resync of this shard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_WIDGETS_GH_USER: ${{ inputs.user || 'Nitjsefnie' }}
          GH_WIDGETS_CLONE_LOOKAHEAD: ${{ inputs.clone_lookahead || '3' }}
          GH_WIDGETS_BLAME_METHOD: ${{ inputs.blame_method || 'both' }}
          GH_WIDGETS_GH_EXTRA_EMAILS: ${{ inputs.extra_emails || 'zmatek.peter@gmail.com' }}
        run: |
          set -euo pipefail
          echo "$GH_WIDGETS_RUN_LABEL: GH_WIDGETS_CLONE_LOOKAHEAD=$GH_WIDGETS_CLONE_LOOKAHEAD GH_WIDGETS_BLAME_METHOD=$GH_WIDGETS_BLAME_METHOD"
          echo "GH_WIDGETS_GH_EXTRA_EMAILS=$GH_WIDGETS_GH_EXTRA_EMAILS"
          mkdir -p /tmp/results /tmp/out
          # Bot counts never touch blame or its memory, and every run shares
          # the job token's one budget of 1,000 GraphQL points per hour.
          sudo -E python3 scripts/resync-memory.py measure \
            --cgroup /sys/fs/cgroup/gfbench \
            --json "/tmp/results/$GH_WIDGETS_RUN_LABEL.json" \
            --label "$GH_WIDGETS_RUN_LABEL" \
            --stdout "/tmp/results/$GH_WIDGETS_RUN_LABEL.out" \
            --stderr "/tmp/results/$GH_WIDGETS_RUN_LABEL.err" \
            -- env \
              "PATH=/tmp/venv-$GH_WIDGETS_BUILD/bin:$PATH" \
              "GH_WIDGETS_GH_USER=$GH_WIDGETS_GH_USER" \
              "GH_TOKEN=$GH_TOKEN" \
              "GH_WIDGETS_OUT_DIR=/tmp/out" \
              "GH_WIDGETS_CACHE_FILE=/tmp/cache.json" \
              "GH_WIDGETS_DEBUG_TIMING=1" \
              "GH_WIDGETS_CLONE_LOOKAHEAD=$GH_WIDGETS_CLONE_LOOKAHEAD" \
              "GH_WIDGETS_BLAME_METHOD=$GH_WIDGETS_BLAME_METHOD" \
              "GH_WIDGETS_GH_EXTRA_EMAILS=$GH_WIDGETS_GH_EXTRA_EMAILS" \
              "GH_WIDGETS_IMPACT_REPO_PINS=/tmp/pins.json" \
              "GH_WIDGETS_IMPACT_SHARD=$GH_WIDGETS_IMPACT_SHARD" \
              "GH_WIDGETS_IMPACT_COUNT_BOT_PRS=1" \
              python3 "$GITHUB_WORKSPACE/src/render-impact.py" --resync

      - name: Validate the run before any number is believed
        run: |
          python3 scripts/resync-memory.py validate --label "$GH_WIDGETS_RUN_LABEL" \
            --results /tmp/results --svg /tmp/out/impact.svg

      - name: Upload the run's results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitfame-resync-memory-run-${{ matrix.build }}-r${{ matrix.repeat }}-s${{ matrix.shard }}
          path: /tmp/results/
          retention-days: 14

  report:
    needs: [pins, measure]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gitfame-resync-memory-pins
          path: /tmp

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gitfame-resync-memory-run-*
          merge-multiple: true
          path: /tmp/results

      - name: Prove every shard ran once, then summarise
        env:
          GH_WIDGETS_BUILDS: ${{ needs.pins.outputs.builds }}
          GH_WIDGETS_REPEATS: ${{ needs.pins.outputs.repeats }}
        run: |
          python3 scripts/resync-memory.py report --results /tmp/results --pins /tmp/pins.json \
            --builds "$GH_WIDGETS_BUILDS" --repeats "$GH_WIDGETS_REPEATS"
