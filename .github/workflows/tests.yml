name: tests

# CI from scratch (issue #4), modelled on claudit's tests.yml, adapted:
# - push only — no pull_request_review gate; overkill for a single-author
#   repo.
# - no services and no dependencies: the suite is stdlib unittest with no
#   network (gql_fn is injected), so discover on ubuntu-latest is the
#   whole job.

on:
  push:
    # Deny-list rather than an allow-list: a new top-level code directory
    # would silently stop being tested under an allow-list, whereas an
    # unlisted path here just runs CI needlessly.
    paths-ignore:
      - '**/*.md'
      - 'PRESENTATION.txt'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  # A push that supersedes an in-flight run for the same ref cancels it —
  # nothing is learned from CI for a commit that is already history.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run tests
        run: python3 -m unittest discover -v
