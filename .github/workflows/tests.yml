name: tests

# CI from scratch (issue #4), modelled on claudit's tests.yml, adapted:
# - push, plus a read-only pull_request gate (issue #8) so a contributor
#   head — a fork's included — is tested before merge. No
#   pull_request_review gate; overkill for a single-author repo.
# - the suite runs across the OS × Python matrix below, not just one
#   environment (issue #6).
# - no services and no network (gql_fn is injected): the suite is stdlib
#   unittest. pytest is neither a suite dependency nor a CI tool any more: it
#   was speed.yml's timing harness, and that job counts CPU seconds now. The
#   pinned requirement remains available to local pytest runs.

on:
  push:
    # Deny-list rather than an allow-list: a new top-level code directory
    # would silently stop being tested under an allow-list, whereas an
    # unlisted path here just runs CI needlessly.
    paths-ignore:
      - '**/*.md'
      - 'PRESENTATION.txt'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'

  # Read-only by construction: the pull_request event's token is
  # read-only on a fork, and the checkout below already runs with
  # persist-credentials: false. Same deny-list as push.
  #
  # push stays unfiltered by branch ON PURPOSE: it is the CI for the
  # default branch and for working branches worked without a PR, while
  # pull_request is the pre-merge gate. A same-repository branch with an
  # open PR therefore runs BOTH events — deliberate redundancy, not
  # duplication to deduplicate: they answer different questions (does
  # this branch tip pass / would this merge pass), and the concurrency
  # key below is the ref, so neither run cancels the other.
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'PRESENTATION.txt'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'

# Least privilege: this job only reads the tree. Without an explicit
# block it inherits the repository default, which can be read/write
# for the whole token.
permissions:
  contents: read

concurrency:
  # A newer revision for the same ref — a push, or a new PR head — cancels
  # the in-flight run: nothing is learned from CI for a commit that is
  # already history.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # Pin bash on every OS. Windows would otherwise run these blocks
        # under pwsh, and nothing here is shell-agnostic: the line
        # continuations and the $GITHUB_STEP_SUMMARY writes assume POSIX
        # shell. Git-bash ships with the hosted Windows runner.
        shell: bash

    strategy:
      # One red cell must not hide another — each OS × Python pair is its
      # own diagnosis.
      fail-fast: false
      matrix:
        # The span CI can actually vouch for. README claims the renderer
        # runs on Python 3.9+, but the pinned measurement toolchain
        # (coverage, pytest) requires >= 3.10, so 3.10 is the oldest
        # version a green run here can prove. 3.13 is the version the
        # other gates run.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
        include:
          # The one cell that MEASURES the suite; every other cell just
          # runs it. Coverage is comparable only within a single Python
          # build, so the ratchet below stays calibrated to the one cell
          # it was measured on rather than becoming six gates with six
          # unknown floors.
          - os: ubuntu-latest
            python-version: "3.13"
            measured: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency
          # pulls in — reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the test toolchain
        id: install
        # The renderer and suite are stdlib-only; coverage is needed on the
        # measured cell. pytest is pinned only so a local run of the same
        # files works; nothing in this workflow asks it for anything.
        # Install requirements-test.txt on EVERY cell
        # so every cell runs the whole suite with the same toolchain. Every
        # run block uses `python`, not `python3`: hosted Windows runners have
        # no python3 on PATH, and setup-python puts python on PATH on all
        # three OSes.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Install the pinned git-fame
        if: matrix.measured == true
        run: |
          FORK_PIN="git+https://github.com/Nitjsefnie-OSC/git-fame@65925d8263576dc02510f06aadbcf0386d4edada"
          python -m pip install "$FORK_PIN"

      - name: Run tests
        id: unittest
        # Still `unittest discover`, under coverage on the measured cell.
        # pytest is not the runner here and should not become one; every
        # test module in this suite is stdlib unittest and none of them
        # imports it.
        env:
          # Undefined on the other five cells, so these read as "" there.
          MEASURED: ${{ matrix.measured }}
          GH_WIDGETS_REQUIRE_GIT_FAME: ${{ matrix.measured }}
        run: |
          if [ "$MEASURED" = "true" ]; then
            # Every shipped source family is in the population, scripts/
            # included: resolve-repo-pins.py, compare_durations.py and the
            # three bench files all run in workflows below, so omitting them
            # reported a coverage number for a smaller program than the one
            # that ships. Only the tests themselves are left out — they are
            # the instrument, not the subject.
            python -m coverage run --source=. --omit='test_*.py' \
              -m unittest discover -v
          else
            python -m unittest discover -v
          fi

      - name: Coverage summary
        # Renders whether or not the gate below passes — a coverage
        # regression is only actionable if you can see WHICH file lost
        # lines, and re-reading a scrolled CI log to find that is exactly
        # the friction that gets a gate disabled.
        if: ${{ !cancelled() && steps.unittest.conclusion != 'skipped' && matrix.measured == true }}
        run: |
          {
            echo '### Coverage'
            echo
            python -m coverage report --format=markdown --precision=1
          } >> "$GITHUB_STEP_SUMMARY"
          python -m coverage xml -o coverage.xml
          # The gate step below reads this, not the human summary: it is the
          # one surface that states the totals as data instead of as a table.
          python -m coverage json -o coverage.json

      - name: Upload coverage.xml
        if: ${{ !cancelled() && steps.unittest.conclusion != 'skipped' && matrix.measured == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # One measured cell, so one artifact — no per-matrix naming.
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

      - name: Coverage gate
        if: ${{ !cancelled() && steps.unittest.conclusion != 'skipped' && matrix.measured == true }}
        # A RATCHET, not a target — and the floor is committed data now, not a
        # literal in this file: coverage-floor.json at the repository root
        # carries it, coverage-ratchet.yml raises it automatically on main
        # whenever coverage climbs, and there is no code path that lowers it.
        # So this step only ever asks the question; it never answers it.
        run: python scripts/ci/coverage_ratchet.py gate --coverage-json coverage.json
