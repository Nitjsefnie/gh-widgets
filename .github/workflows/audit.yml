name: audit

# Dependency vulnerability gate: pip-audit resolves each requirements file
# to its full transitive tree and checks every resolved version against the
# PyPI advisory database and OSV.
#
# The runtime is pure stdlib, with zero third-party imports. This gate
# covers the toolchain manifests at the repository root, now including the
# two new tool manifests: those tools run in CI with the repository token,
# and a compromised one is a supply-chain problem even though it never ships.
#
# Resolution is still the point rather than reading the pinned lines: a
# linter drags in a dependency tree of its own, and that is where an
# advisory lands.
#
# WHY THE CRON IS THE IMPORTANT TRIGGER. The consolidated tests workflow
# runs this gate when a changed pin needs auditing. This schedule answers
# "is a version we froze months ago still safe", and that answer changes
# when a stranger publishes an advisory, with no commit here to hang it on.
# Without the cron, an abandoned branch could report clean forever even
# after a new advisory applies to one of its pinned dependencies.
#
# This gate FAILS the build rather than filing an advisory, which is the
# same stance as lint and types: a red gate that a human must look at beats
# a notification that accumulates unread. When a fix genuinely is not
# available yet, add the advisory to --ignore-vuln below WITH a comment
# saying why and what would clear it — never silence the whole gate.

on:
  schedule:
    - cron: '12 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency
          # pulls in — reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          # The runtime is pure stdlib, but the root toolchain manifests
          # (requirements-*.txt) are what this pip cache keys on. The glob
          # covers every manifest, including the new ones.
          cache-dependency-path: requirements-*.txt

      - name: Install pip-audit
        run: python -m pip install -r requirements-pip-audit.txt

      - name: Audit dependencies
        # Each root manifest gets its own pip-audit invocation. Combining
        # them sends all --requirement files through one internal pip dry-run;
        # a hash-pinned manifest beside an unhashed one flips that resolution
        # into --require-hashes mode and fails on hashes the other manifest
        # does not carry (observed on pr-gate's first run). Per-manifest
        # auditing also brings the new zizmor and pip-audit manifests into the
        # audit automatically.
        #
        # No --ignore-vuln entries at present. Each one added here must
        # carry a comment naming the advisory, why it is not fixable, and
        # what would let it be removed.
        #
        # THE RETRY IS NARROW ON PURPOSE. This retries ONLY transport/service
        # failures: connection errors, could-not-connect, SSLError, HTTP 5xx,
        # rate-limited 429 — the sole retried 4xx, checked before ServiceError
        # so other 4xx responses exit immediately — and a ServiceError
        # exception. Findings and every other failure are reported
        # immediately. A persisting transport failure is reported as an
        # unreachable advisory feed.
        run: |
          shopt -s nullglob
          manifests=(requirements*.txt)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "no requirements*.txt manifest at the repository root; nothing to audit" >&2
            exit 1
          fi

          for manifest in "${manifests[@]}"; do
            echo "auditing $manifest"
            resolved=0
            for attempt in 1 2 3; do
              if pip-audit --progress-spinner off --requirement "$manifest" > audit.out 2>&1; then
                cat audit.out
                resolved=1
                break
              fi

              if grep -qiE '4[0-9][0-9] Client Error' audit.out \
                  && ! grep -qiE '429 (Client Error|Too Many Requests)' audit.out; then
                echo "pip-audit failed with a non-retryable 4xx client error:" >&2
                cat audit.out >&2
                exit 1
              fi

              if grep -qiE 'connection (aborted|reset|error)|read timed out|temporary failure in name resolution' audit.out \
                  || grep -qiE 'Could not connect to (PyPI|OSV).*vulnerability feed' audit.out \
                  || grep -qiE '(^|[[:space:]])[[:alnum:]_.]*SSLError:' audit.out \
                  || grep -qiE '5[0-9][0-9] Server Error|502 Bad Gateway|503 Service Unavailable|504 Gateway Timeout|429 (Client Error|Too Many Requests)' audit.out \
                  || grep -qiE '(^|[[:space:]])(pip_audit\._service\.interface\.)?ServiceError:' audit.out; then
                if [ "$attempt" -lt 3 ]; then
                  echo "attempt $attempt: transport/service failure, retrying"
                  tail -n 5 audit.out
                  sleep $(( attempt * 15 ))
                fi
                continue
              fi

              echo "pip-audit reported findings:" >&2
              cat audit.out >&2
              exit 1
            done

            if [ "$resolved" -eq 0 ]; then
              echo "pip-audit exhausted 3 attempts on $manifest after a transport/service failure:" >&2
              cat audit.out >&2
              exit 1
            fi
          done
