name: size baseline

# Gate per-file line counts against the base record on pull requests.
# Main pushes tighten the record; ratchet-push.yml validates and lands it.
# A data-only landed window stages nothing, ending the automated feedback.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: size-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  size-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: Nitjsefnie-Actions/size-ratchet@67bb01e536611398a3b5cedd3f3cf95fd6e5693e # v1.0.1
        with:
          ceilings: ''
          overrides: ''
          exclude: ''
          unclassified: 'ignore'
          records: '.github/size-baseline.json'
          member: ''
          mode: 'auto'
          base-ref: ${{ github.event.pull_request.base.sha }}
          stale: 'warn'
          require-tight: 'false'
      - name: Stage tightened size records
        id: stage
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_WIDGETS_RATCHET_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if python3 scripts/ci/changes_detect.py --ratchet-data-only; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          diff_status=0
          git diff --quiet HEAD -- .github/size-baseline.json || diff_status=$?
          if [ "$diff_status" -eq 0 ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No size record tightened; nothing to stage.'
          elif [ "$diff_status" -eq 1 ]; then
            stage="$RUNNER_TEMP/ratchet-data"
            mkdir -p "$stage"
            cp .github/size-baseline.json "$stage/size-baseline.json"
            printf '%s\n' "$GITHUB_SHA" > "$stage/base.txt"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Could not compare size records against HEAD' >&2
            exit 1
          fi
      - name: Upload the tightened size records
        if: steps.stage.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ratchet-push
          path: |
            ${{ runner.temp }}/ratchet-data/base.txt
            ${{ runner.temp }}/ratchet-data/size-baseline.json
          retention-days: 1
          if-no-files-found: error
