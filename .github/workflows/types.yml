name: types

# Type gate (issue #5): pyright at `basic` — strict on an existing
# codebase produces noise that gets ignored, which is worse than no
# check. Config is checked in (pyrightconfig.json) so CI and every editor
# use the same settings. The code is pure stdlib, so no runtime
# dependencies need installing for imports to resolve.

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'PRESENTATION.txt'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'

concurrency:
  group: types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pyright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pyright
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: pyright
        run: pyright
