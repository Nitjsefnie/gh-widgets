name: types

# Type gate (issue #5): pyright at `basic` — strict on an existing
# codebase produces noise that gets ignored, which is worse than no
# check. Config is checked in (pyrightconfig.json) so CI and every editor
# use the same settings. The code is pure stdlib, so no runtime
# dependencies need installing for imports to resolve.

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'PRESENTATION.txt'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'

# Least privilege: this job only reads the tree. Without an explicit
# block it inherits the repository default, which can be read/write
# for the whole token.
permissions:
  contents: read

concurrency:
  group: types-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pyright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing in this workflow pushes. Leaving the job token in
          # .git/config lets any later step — or anything a dependency
          # pulls in — reuse it.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          # There is no requirements.txt here (runtime is pure stdlib), so
          # the cache must be keyed off the dev pins explicitly or
          # setup-python fails the job looking for one.
          cache-dependency-path: requirements-*.txt

      - name: Install pyright
        run: |
          python -m pip install --upgrade pip
          # requirements-test.txt too, or pyright cannot resolve the pytest
          # import in test_compare_durations.py and reports it as an error.
          # The runtime is stdlib, so this IS the whole set of third-party
          # names pyright needs to know about.
          pip install -r requirements-dev.txt -r requirements-test.txt

      - name: pyright
        run: pyright
