name: test-ratchet comment

# A fork's pull request runs `tests` with a token that cannot write to this
# repository, so its `report` job cannot comment. This workflow comments for
# it once `tests` completes: it runs test-ratchet's `report` on the triggering
# run's artifacts, checks out the default branch, and checks out and runs
# nothing from the pull request.
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] nothing from the pull request is checked out or run
    workflows: [tests]
    types: [completed]

permissions: {}

concurrency:
  group: test-ratchet-comment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    if: >-
      github.event.workflow_run.event == 'pull_request'
      && (github.event.workflow_run.head_repository.full_name != github.repository
      || github.event.workflow_run.actor.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Nitjsefnie-Actions/test-ratchet/report@ad6505d6da67b129dddbecb326f03d19e834c74c # v1.0.0
        with:
          github-token: ${{ github.token }}
          cell: ubuntu-latest / 3.15
          run-id: ${{ github.event.workflow_run.id }}
