name: secrets

# Scan the tree and all available Git history for credentials that GitHub
# push protection does not recognize.
#
# A SHA's newest run is judged through the required aggregate fold:
# `aggregate` in tests.yml waits for its `gitleaks` job on the same head
# SHA, so a push run's group carries that SHA: no later push cancels it.
# It has no required check or ruleset of its own.
#
# The daily cron catches commits no workflow saw, including a [skip ci] push
# and commits that predate this workflow.
#
# The binary is frozen by hand and its digest is verified below. Every bump
# rescans the full history under the new rules.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '26 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks scans Git history as well as the checked-out tree.
          fetch-depth: 0
          persist-credentials: false

      - name: Download gitleaks and verify its digest
        run: |
          curl --connect-timeout 5 --max-time 60 --retry 3 --retry-all-errors --retry-delay 5 --no-progress-meter -fLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks version

      - name: Take the scan's config and ignore list from the trusted commit
        # Read from the judged tree, they would let a change exempt its own
        # finding, so the base commit (a pull request), the previous head (a
        # push) or main's tip (schedule, dispatch) supplies them.
        env:
          GH_WIDGETS_EVENT_NAME: ${{ github.event_name }}
          GH_WIDGETS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_WIDGETS_BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$GH_WIDGETS_EVENT_NAME" in
            pull_request) trusted="$GH_WIDGETS_BASE_SHA" ;;
            push) trusted="$GH_WIDGETS_BEFORE_SHA" ;;
            # Main's tip, whichever branch a dispatch scans.
            *) trusted="$(git rev-parse --verify --quiet refs/remotes/origin/main)" || trusted= ;;
          esac
          # An empty name would read the index, the judged tree.
          read_trusted() {
            case "$trusted" in '' | *[!0-9a-f]*) return 1 ;; esac
            git cat-file blob "$trusted:$1"
          }
          dir="$RUNNER_TEMP/gitleaks-trusted"
          mkdir -p "$dir"
          if ! read_trusted .gitleaks.toml > "$dir/.gitleaks.toml"; then
            echo "no .gitleaks.toml at trusted commit '$trusted': default rules"
            printf '[extend]\nuseDefault = true\n' > "$dir/.gitleaks.toml"
          fi
          if ! read_trusted .gitleaksignore > "$dir/.gitleaksignore"; then
            echo "no .gitleaksignore at trusted commit '$trusted': nothing ignored"
          fi
          python3 -I - "$dir/.gitleaks.toml" <<'PY'
          import sys
          import tomllib

          def keys(table, prefix=""):
              for key, value in table.items():
                  name = prefix + key.lower()
                  yield name, value
                  if isinstance(value, dict):
                      yield from keys(value, name + ".")

          with open(sys.argv[1], "rb") as config:
              if any(n == "extend.path" and v != "" for n, v in keys(tomllib.load(config))):
                  sys.exit("trusted .gitleaks.toml sets [extend] path, which gitleaks "
                           "resolves inside the judged checkout: refusing to scan")
          PY

      - name: Scan the tree and the history
        # Bare on purpose: this step's exit status is the gate, with no
        # condition, fallback, or error-swallowing suffix. --redact masks
        # finding values in the public workflow log. The tree's
        # .gitleaksignore goes, and every path is forced to text (`* diff`;
        # `!diff` leaves git's binary detection on, and gitleaks skips what
        # it calls binary). --ignore-gitleaks-allow stops inline markers.
        run: |
          rm -rf .gitleaksignore
          echo '* diff' > .git/info/attributes
          ./gitleaks detect --verbose --redact --ignore-gitleaks-allow \
            --config "$RUNNER_TEMP/gitleaks-trusted/.gitleaks.toml" \
            --gitleaks-ignore-path "$RUNNER_TEMP/gitleaks-trusted" \
            --log-opts='--full-history --all --diff-filter=uxdb --diff-merges=remerge'
