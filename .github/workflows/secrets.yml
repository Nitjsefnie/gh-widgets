name: secrets

# Scan the tree and all available Git history for credentials that GitHub
# push protection does not recognize.
#
# A pull request run is required through the aggregate fold: the required
# `aggregate` check in tests.yml waits for this workflow's `gitleaks` job on
# the same head SHA. This workflow has no required check or ruleset of its own.
#
# The daily cron catches commits no workflow saw, including a [skip ci] push
# and commits that predate this workflow. Every run scans the full history.
#
# The binary is frozen by hand and its digest is verified below. Every bump
# rescans the full history under the new rules.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '26 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks scans Git history as well as the checked-out tree.
          fetch-depth: 0
          persist-credentials: false

      - name: Download gitleaks and verify its digest
        run: |
          curl --connect-timeout 5 --max-time 120 -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum -c -
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks version

      - name: Scan the tree and the history
        # Bare on purpose: this step's exit status is the gate, with no
        # condition, fallback, or error-swallowing suffix. --redact masks
        # finding values in the public workflow log.
        run: ./gitleaks detect --verbose --redact --config .gitleaks.toml
