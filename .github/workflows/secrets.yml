name: secrets

# Scan the tree and all Git history for credentials that GitHub push
# protection does not recognize, with Nitjsefnie-Actions/secret-scan.
#
# A SHA's newest run is judged through the required aggregate fold:
# `aggregate` in tests.yml waits for its `gitleaks` job on the same head
# SHA, so a push run's group carries that SHA: no later push cancels it.
#
# The daily cron catches commits no workflow saw, including a [skip ci] push
# and commits that predate this workflow.
#
# The action runs gitleaks 8.30.1, checks the binary and its default rules
# against pinned digests, and reads .gitleaks.toml and .gitleaksignore from
# the commit the change is judged against, not from the judged tree.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '26 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scan reads Git history as well as the checked-out tree.
          fetch-depth: 0
          persist-credentials: false

      - uses: Nitjsefnie-Actions/secret-scan@f6b0956e1bfea8aec4a4524032c3e7bbbc35b28b # v1.1.0
