name: coverage-ratchet

# Measures coverage against the committed floor. A new measurement must beat
# recorded measured by MORE than 1.5 points before raise writes a candidate,
# whose floor keeps a fixed 1.5-point gap below that new measurement. Making
# the automated floor equal measured would turn a 0.1-point dip red.
# ratchet-push.yml lands only a strictly higher floor after this run succeeds.
# The old hand-edited fail-under literal in tests.yml rotted until it was
# deleted or ignored; this workflow keeps the comparison tied to committed data.
#
# WHY THIS IS A SEPARATE WORKFLOW. tests.yml runs a matrix and a whole test
# suite; this workflow measures the release branch on the same cell named by
# the floor and stages a candidate artifact for the separate data-only push job.
#
# WHY IT IS A RELEASE GATE. release.yml's manifest lists this workflow, so a
# release waits for it. The floor is committed DATA now, and a release must
# not ship a tree that is below its own committed floor — a coverage floor
# that only guards the branch between pushes guards nothing about the artefact
# people install. The other manifest gates say the same thing about their own
# subject: a release waits for lint and for types because it must not ship a
# tree that does not lint or does not typecheck.
#
# WHICH OF ITS JOBS CAN BLOCK A RELEASE. Only measure, whose check run is
# named coverage-ratchet and is the manifest entry. This workflow has no
# other job, so it creates no incidental check run for release.yml to classify.
#
# AND WHAT IT BLOCKS AFTER MERGE. Adding or removing a measured module leaves
# tests.yml green on the pull request, because the gate deliberately judges
# coverage without comparing file counts; the `files` tripwire fires only here,
# on main, where `measure` exits 2. Because `coverage-ratchet` is a manifest
# entry, that red blocks every release cut at that commit until someone
# re-derives the floor in gate/coverage-floor.json. That is the intended cost of a
# floor that is committed data, not an oversight: the population moved and the
# floor has to be told.

on:
  # The ONLY trigger and the narrowest one that matches this release gate.
  # The workflow measures the already-merged main branch after its changes have
  # passed review; it does not measure pull request or manually dispatched trees.
  # WHY THE PUSH BLOCK CARRIES A DENY-LIST AT ALL. This workflow is a release
  # gate (see the header), and the manifest admits a push-triggered workflow
  # only if its push block has no allow-list — an allow-list would have to
  # name the version file before this could gate a release at all. So the
  # list below is tests.yml's deny-list verbatim, for tests.yml's reason: a
  # new top-level directory would silently stop being measured under an
  # allow-list. Every entry is something a docs-or-sample change cannot
  # change the coverage of, so the run is skipped rather than run needlessly.
  #
  # The version file is deliberately NOT in that list, and that is
  # load-bearing rather than an omission: it is the file a release is cut
  # for, and a push that changes it must still measure and gate. Listing it
  # would silently drop this gate out of every release — the one failure the
  # manifest exists to prevent. (Stated here, above `push:`, because the
  # block below is read by the manifest's own completeness check, which
  # refuses a push block that names the version file at all, comment or not.)
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'PRESENTATION.txt'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  # Ratchet pushes preserve the code push's in-flight measurement. Other
  # pushes supersede it; a null/absent committer username still cancels.
  group: coverage-ratchet-${{ github.ref }}
  cancel-in-progress: ${{ github.event.head_commit.committer.username != 'github-actions[bot]' }}

jobs:
  measure:
    # Without this the check run is reported as `measure` and release.yml's
    # manifest entry — `coverage-ratchet` — would never match it, so every
    # release would sit out the whole deadline waiting for a gate whose name
    # does not exist. The job key stays `measure`; only the check-run name
    # changes, and the manifest entry is written against THIS string.
    name: coverage-ratchet
    runs-on: ubuntu-latest
    # Observed at 1.2 minutes; 10 minutes caps a hung job below GitHub's 6-hour default.
    timeout-minutes: 10

    # No `permissions:` block: it inherits this workflow's `contents: read`.
    # Stated here rather than left implicit because this is the job that runs
    # the repository's code, and it is the job that must hold nothing.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The same cell tests.yml measures on, deliberately. A coverage
          # percentage is only comparable within one interpreter build; a
          # ratchet calibrated on a different cell measures the difference
          # between the cells.
          python-version: "3.13"

      - name: Install the test toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/test.txt

      - name: Install the pinned git-fame
        # Parity with tests.yml's measured cell, which installs this same pin
        # and runs the suite with GH_WIDGETS_REQUIRE_GIT_FAME set. Without it
        # the git-fame-gated test classes skip, and the skip is SILENT in the
        # number: the suite stays green while the three statements covering
        # impact_loc.check_git_fame()'s success path go unexecuted, moving the
        # reading 903 -> 906 missing and 83.2 -> 83.1 against an unchanged
        # 5385-statement floor — the red of run 37203738774. A floor is only
        # comparable within one program-environment, not just one interpreter
        # build; this step is what makes this job's program the one the floor
        # was measured over. GH_WIDGETS_REQUIRE_GIT_FAME on the Measure step
        # below turns any future absence into a loud failure rather than a
        # quiet skip.
        run: |
          FORK_PIN="git+https://github.com/Nitjsefnie-OSC/git-fame@65925d8263576dc02510f06aadbcf0386d4edada"
          python -m pip install "$FORK_PIN"

      - name: Measure
        env:
          GH_WIDGETS_REQUIRE_GIT_FAME: "true"
        run: |
          python -m coverage run --source=. --omit='tests/*' \
            -m unittest discover
          python -m coverage json -o coverage.json

      - name: Gate
        # The ratchet is checked here as well as in tests.yml, so a floor that
        # is already broken shows up on the workflow whose job owns it rather
        # than only on a different file's push run.
        run: |
          python scripts/ci/coverage_ratchet.py gate \
            --coverage-json coverage.json

      - name: Compute the candidate floor
        # The checked-out floor stays untouched because the raise subcommand
        # operates on its copy. The stage step below publishes a strict climb
        # as data for ratchet-push.yml.
        #
        # --floor-file points at a copy so the checkout is not dirtied by the
        # run, and so the artifact is unmistakably the ratchet's output rather
        # than the file that went in.
        run: |
          cp gate/coverage-floor.json candidate-coverage-floor.json
          python scripts/ci/coverage_ratchet.py raise \
            --coverage-json coverage.json \
            --floor-file candidate-coverage-floor.json \
            --commit "$GITHUB_SHA"

      - name: Stage a climbable floor
        id: stage
        # A moved population still fails the `files` tripwire above. A human
        # re-derives that record before any candidate can be staged.
        # Raise already enforces >1.5 points above recorded measured and the
        # fixed gap; this step uploads only an actual floor climb. A smaller
        # improvement leaves the candidate byte-identical and stages nothing.
        env:
          GH_TOKEN: ${{ github.token }}
          RATCHET_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if python3 scripts/ci/changes_detect.py --ratchet-data-only; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! candidate=$(jq -r '.floor' candidate-coverage-floor.json); then
            echo "::error::Could not read the candidate coverage floor."
            exit 1
          fi
          if ! committed=$(jq -r '.floor' gate/coverage-floor.json); then
            echo "::error::Could not read the committed coverage floor."
            exit 1
          fi
          if ! climbed=$(awk -v candidate="$candidate" -v committed="$committed" \
              'BEGIN { print (candidate > committed) ? 1 : 0 }'); then
            echo "::error::Could not compare the coverage floors."
            exit 1
          fi

          if [ "$climbed" = 1 ]; then
            stage="$RUNNER_TEMP/ratchet-data"
            mkdir -p "$stage"
            cp candidate-coverage-floor.json "$stage/coverage-floor.json"
            printf '%s\n' "$GITHUB_SHA" > "$stage/base.txt"
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            if ! cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Coverage floor staged for ratchet-push
          Measured coverage floor: $candidate; committed floor: $committed.

          The successful coverage-ratchet run staged this record for the
          trusted ratchet-push workflow.
          EOF
            then
              echo "::error::Could not append the staged coverage floor summary."
              exit 1
            fi
            notice="Measured coverage floor is $candidate; committed floor is $committed. "
            notice+="The candidate is staged for the trusted ratchet-push workflow."
            if ! printf '::notice::%s\n' "$notice"; then
              exit 1
            fi
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            if ! printf '%s\n' "Coverage floor has not climbed."; then
              exit 1
            fi
          fi

      - name: Upload the tightened coverage floor
        if: steps.stage.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ratchet-push
          path: |
            ${{ runner.temp }}/ratchet-data/base.txt
            ${{ runner.temp }}/ratchet-data/coverage-floor.json
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-floor-candidate
          path: candidate-coverage-floor.json
          if-no-files-found: error
