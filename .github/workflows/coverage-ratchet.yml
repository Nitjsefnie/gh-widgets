name: coverage-ratchet

# Raises the committed coverage floor in coverage-floor.json, and only ever
# raises it. The floor used to be a hand-edited `--fail-under=81` literal in
# tests.yml with a comment telling the next human to bump it, which is a
# ratchet nobody ratchets: it rots until it is deleted or ignored. Here the
# movement is CI's job, and the direction is the script's only option.
#
# WHY THIS IS A SEPARATE WORKFLOW. tests.yml runs a matrix and a whole test
# suite; the write belongs nowhere near either. This file is the only one in
# the repository that holds a `contents: write` token for a routine push, and
# keeping it alone here means the entire write surface is one short file a
# reviewer can read in full.
#
# WHY IT IS A RELEASE GATE. release.yml's manifest lists this workflow, so a
# release waits for it. The floor is committed DATA now, and a release must
# not ship a tree that is below its own committed floor — a coverage floor
# that only guards the branch between pushes guards nothing about the artefact
# people install. The other manifest gates say the same thing about their own
# subject: a release waits for lint and for types because it must not ship a
# tree that does not lint or does not typecheck.
#
# WHICH OF ITS JOBS CAN BLOCK A RELEASE. Only `measure`, whose check run is
# named `coverage-ratchet` and is the manifest entry. `raise` is a maintenance
# action — it writes the floor file — and it must NEVER be able to fail a
# release: it is designed to fail its own compare-and-swap when something
# landed on main concurrently, and that outcome is correct. release.yml treats
# any check run outside the manifest with a bad conclusion as grounds to
# refuse, so a red `raise` would block a release for a reason this repository
# has declared correct. It therefore tolerates its own failure loudly: stderr
# and a dated line in the step summary, then exit 0. The write did not happen,
# the next push to main measures again and retries, and nothing is corrupted.
#
# AND WHAT IT BLOCKS AFTER MERGE. Adding or removing a measured module leaves
# tests.yml green on the pull request, because the gate deliberately judges
# coverage without comparing file counts; the `files` tripwire fires only here,
# on main, where `measure` exits 2. Because `coverage-ratchet` is a manifest
# entry, that red blocks every release cut at that commit until someone
# re-derives the floor in coverage-floor.json. That is the intended cost of a
# floor that is committed data, not an oversight: the population moved and the
# floor has to be told.

on:
  # The ONLY trigger, and the narrowest one that can fire. The job below holds
  # a write token, so it runs on a trusted event over already-merged,
  # already-reviewed code and over nothing else: no pull_request (a
  # same-repository PR would retain the write scope — an added trigger
  # inherits the job's permissions, it does not shrink them), no
  # workflow_dispatch, no schedule, no workflow_run. main is the branch
  # whose every commit has been through every other gate.
  #
  # WHY THE PUSH BLOCK CARRIES A DENY-LIST AT ALL. This workflow is a release
  # gate (see the header), and the manifest admits a push-triggered workflow
  # only if its push block has no allow-list — an allow-list would have to
  # name the version file before this could gate a release at all. So the
  # list below is tests.yml's deny-list verbatim, for tests.yml's reason: a
  # new top-level directory would silently stop being measured under an
  # allow-list. Every entry is something a docs-or-sample change cannot
  # change the coverage of, so the run is skipped rather than run needlessly.
  #
  # The version file is deliberately NOT in that list, and that is
  # load-bearing rather than an omission: it is the file a release is cut
  # for, and a push that changes it must still measure and gate. Listing it
  # would silently drop this gate out of every release — the one failure the
  # manifest exists to prevent. (Stated here, above `push:`, because the
  # block below is read by the manifest's own completeness check, which
  # refuses a push block that names the version file at all, comment or not.)
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'PRESENTATION.txt'
      - 'docs/**'
      - 'examples/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

concurrency:
  # A newer main supersedes an in-flight raise. Cancelling is right here and
  # wrong in release.yml for the opposite reason: a stale measurement raising a
  # floor from a commit that is no longer the tip would raise the floor to a
  # number the tree no longer has.
  group: coverage-ratchet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    # Without this the check run is reported as `measure` and release.yml's
    # manifest entry — `coverage-ratchet` — would never match it, so every
    # release would sit out the whole deadline waiting for a gate whose name
    # does not exist. The job key stays `measure`; only the check-run name
    # changes, and the manifest entry is written against THIS string.
    name: coverage-ratchet
    runs-on: ubuntu-latest

    # No `permissions:` block: it inherits this workflow's `contents: read`.
    # Stated here rather than left implicit because this is the job that runs
    # the repository's code, and it is the job that must hold nothing.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The same cell tests.yml measures on, deliberately. A coverage
          # percentage is only comparable within one interpreter build; a
          # ratchet calibrated on a different cell measures the difference
          # between the cells.
          python-version: "3.13"

      - name: Install the test toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Measure
        run: |
          python -m coverage run --source=. --omit='test_*.py' \
            -m unittest discover
          python -m coverage json -o coverage.json

      - name: Gate
        # The ratchet is checked here as well as in tests.yml, so a floor that
        # is already broken shows up on the workflow whose job owns it rather
        # than only on a different file's push run.
        run: |
          python scripts/ci/coverage_ratchet.py gate \
            --coverage-json coverage.json

      - name: Compute the candidate floor
        # The DECISION is made here, in the job that holds no write scope and
        # is the only job with a tree on disk. What comes out is a finished
        # file — the raise job below compares it with main's copy and PUTs it
        # or does nothing, and never runs a line of this repository.
        #
        # `--floor-file` is pointed at a copy so the checkout is not dirtied
        # by the run, and so the artifact is unmistakably the ratchet's
        # OUTPUT rather than the file that went in.
        run: |
          cp coverage-floor.json candidate-coverage-floor.json
          python scripts/ci/coverage_ratchet.py raise \
            --coverage-json coverage.json \
            --floor-file candidate-coverage-floor.json \
            --commit "$GITHUB_SHA"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-floor-candidate
          path: candidate-coverage-floor.json
          if-no-files-found: error

  raise:
    needs: measure
    runs-on: ubuntu-latest

    # The only `contents: write` in the repository's CI. Read what is NOT
    # next to it: there is no checkout step, so this job has no copy of this
    # repository on disk at all — nothing a merged commit could put there can
    # be executed, because there is nothing there to execute. Nothing is
    # installed either. The job reads one JSON artifact the read-only job
    # above produced, fetches main's copy of the same file through the
    # Contents API, and writes only when the two differ.
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # A single artifact named here is extracted straight into `path`,
          # not into a subdirectory named after it.
          name: coverage-floor-candidate
          path: candidate

      - name: Raise the floor if coverage climbed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        # Every command below moves or compares bytes, and none of them can
        # run code: `gh` and the coreutils are preinstalled on the runner, and
        # nothing here reads from, writes to, or executes anything under a
        # checkout, because there is none.
        #
        # The byte comparison is what makes the write conditional: the ratchet
        # exits 0 whether or not it moved anything, so the only honest signal
        # that there is something to commit is that main's copy of the file and
        # the candidate differ.
        #
        # PRECONDITION, NOT A GUARANTEE: the commit this step makes is itself
        # a push to main, so it starts one more run of this workflow. That run
        # terminates after one extra pass ONLY IF the measurement is
        # deterministic for an unchanged tree on one cell — which is a property
        # of coverage, not of this mechanism. If the runner's per-file coverage
        # drifts upward between pushes, each push raises the floor again. There
        # is no cap and no hysteresis, by design: a floor with a ceiling is a
        # ceiling, not a ratchet.
        run: |
          gh api "repos/$REPO/contents/coverage-floor.json?ref=main" \
            --jq .content | base64 -d > committed-floor.json
          if diff -q committed-floor.json candidate/candidate-coverage-floor.json \
               >/dev/null; then
            echo "floor unchanged — nothing to commit"
            exit 0
          fi

          # A compare-and-swap on the blob's current SHA: if anything landed
          # on main between the measure job's checkout and now, this PUT is
          # rejected. That rejection is the CORRECT outcome, and it must not
          # fail this job — see the header. `-f`, not `-F`, for the message
          # and branch because they are strings.
          #
          # WHY `continue-on-error: true` IS NOT THE SAME THING. release.yml
          # classifies check RUNS, not run conclusions: any check run outside
          # the manifest that is `completed` with a conclusion outside
          # {success, skipped, neutral} refuses the release. A job-level
          # `continue-on-error` still reports a `failure` conclusion on this
          # job's check run, so it would block the release exactly as hard.
          # The tolerance has to be in the exit status, and it is below.
          blob_sha="$(gh api \
            "repos/$REPO/contents/coverage-floor.json?ref=main" --jq .sha)"
          if gh api --method PUT "repos/$REPO/contents/coverage-floor.json" \
              -f message='Raise the coverage floor' \
              -f branch=main \
              -f sha="$blob_sha" \
              -F content="$(base64 -w0 < candidate/candidate-coverage-floor.json)" \
              --jq '.commit.sha'; then
            echo "Raised the floor on main."
            exit 0
          fi

          # The write did not happen. Nothing is corrupted and nothing is lost:
          # the floor on main is still the last value the ratchet legitimately
          # recorded, and the next push to main measures again and retries. The
          # durable record of that is the step summary, not this log — a stderr
          # line is scrolled away and read by nobody, which is the same reason
          # this repository writes its numbers into files rather than into
          # commit messages.
          echo "Could not raise the floor; the next push to main retries." >&2
          {
            echo "### Coverage floor NOT raised"
            echo
            echo "The compare-and-swap PUT was rejected or \`gh api\` failed, so"
            echo "\`coverage-floor.json\` on \`main\` still carries its previous"
            echo "floor. Nothing is corrupted and the next push to \`main\`"
            echo "measures again and retries."
            echo
            echo '```'
            echo "when: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run:  $GITHUB_RUN_ID ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
