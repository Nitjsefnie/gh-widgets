# Every dependency in this repo is pinned to an exact version, deliberately:
# a tool or library release must never turn CI red on an unchanged commit.
# The cost of that choice is that pins go stale silently, and a stale pin is
# how a fixed CVE stays exploitable. Dependabot pays that cost back — it is
# the counterpart to the pip-audit job in tests.yml, which detects the problem
# but cannot fix it.
#
# There is no npm entry and no eslint here: this repo has no JavaScript at
# all. The renderers emit SVG as text.

version: 2
updates:
  # requirements-dev.txt (lint/type toolchain) and requirements-test.txt
  # (coverage + pytest, pinned for local runs only). There is no backend
  # entry: the runtime is pure stdlib with zero third-party imports, so
  # these tool pins are the entire pip surface.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - dependencies

  # The workflows pin every action to a commit SHA with the version in a
  # trailing comment. A SHA pin does not move at all — which is the point,
  # since these jobs run with a repository token — and it is also why this
  # entry is not optional: without Dependabot a SHA pin is simply frozen
  # forever. It rewrites both the SHA and the comment.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "04:30"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
    # github/codeql-action/init and .../analyze are separate dependencies to
    # Dependabot, so ungrouped it files ONE HALF-BUMP PR PER PIN, and a tree
    # whose init and analyze pins disagree fails every CodeQL run with a
    # configuration error (#22/#23 both went red that way). Each group applies
    # only to its named update kind: the version-update group keeps every
    # action version bump in one atomic PR, and the security-update group does
    # the same for every action security bump. The in-tree tripwire is
    # test_ci_workflows.py.
    groups:
      actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
