# Drop this into your nginx server block (https://example.com/...).
# Adjust paths to match where the renderer writes its SVGs.

location /widgets/ {
    types { image/svg+xml svg; }
    default_type image/svg+xml;
    etag on;

    # CORS so the SVGs can be embedded from anywhere (e.g. github.com READMEs)
    add_header Access-Control-Allow-Origin "*" always;

    # Always revalidate via Last-Modified/ETag. New mtime -> fresh bytes,
    # unchanged file -> cheap 304. `private` keeps CDNs from edge-caching.
    add_header Cache-Control "private, no-cache, must-revalidate" always;
    add_header CDN-Cache-Control "no-store" always;

    try_files $uri =404;
}
